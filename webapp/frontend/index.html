<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 语音情感识别系统</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js 用于可视化 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">🎤 语音情感识别</h1>
                <p class="subtitle">基于深度学习的音频情感分析</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-card">
                    <h2>📁 上传音频文件</h2>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <p class="upload-text">拖拽音频文件到这里或点击上传</p>
                        <p class="upload-hint">支持 .wav, .mp3, .ogg, .flac, .m4a, .aac 格式</p>
                        <input type="file" id="fileInput" accept="audio/*" hidden>
                        <button class="upload-btn" id="uploadBtn">选择文件</button>
                    </div>
                    
                    <div class="file-info" id="fileInfo" style="display: none;">
                        <div class="file-details">
                            <span class="file-icon">🎵</span>
                            <span class="file-name" id="fileName"></span>
                            <span class="file-size" id="fileSize"></span>
                            <button class="remove-btn" id="removeBtn">✕</button>
                        </div>
                    </div>
                </div>

                <!-- Model Selection -->
                <div class="model-card">
                    <h2>🤖 选择模型</h2>
                    <div class="model-list" id="modelList">
                        <!-- Models will be loaded here -->
                    </div>
                </div>

                <!-- Analyze Button -->
                <button class="analyze-btn" id="analyzeBtn" disabled>
                    <span class="btn-text">开始分析</span>
                    <span class="btn-loader" style="display: none;">分析中...</span>
                </button>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="resultsSection" style="display: none;">
                <!-- Main Result -->
                <div class="result-card main-result">
                    <h2>🎯 识别结果</h2>
                    <div class="emotion-display" id="emotionDisplay">
                        <div class="emotion-icon" id="emotionIcon"></div>
                        <div class="emotion-name" id="emotionName"></div>
                        <div class="emotion-confidence" id="emotionConfidence"></div>
                    </div>
                </div>

                <!-- Probability Chart -->
                <div class="result-card chart-card">
                    <h2>📊 情感概率分布</h2>
                    <div class="chart-container">
                        <canvas id="probabilityChart"></canvas>
                    </div>
                </div>

                <!-- Radar Chart -->
                <div class="result-card chart-card">
                    <h2>🕸️ 雷达图</h2>
                    <div class="chart-container">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>

                <!-- Model Info -->
                <div class="result-card info-card">
                    <h2>ℹ️ 详细信息</h2>
                    <div class="info-list" id="infoList"></div>
                </div>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <h2>📜 历史记录</h2>
                <div class="history-list" id="historyList">
                    <p class="empty-history">暂无历史记录</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2024 语音情感识别系统 | 基于深度学习技术</p>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loader">
            <div class="spinner"></div>
            <p>正在分析音频...</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
